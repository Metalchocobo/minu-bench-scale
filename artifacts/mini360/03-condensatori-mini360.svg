<text x="80" y="850" fill="#087d69" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">MONTAGGIO: direttamente sui pad se ci stanno, oppure subito accanto con collegamenti corti.</text>
<text x="80" y="890" fill="#26333d" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start">I ceramici non hanno polarità. La distanza nel disegno serve solo a leggere i collegamenti.</text>
<text x="55" y="955" fill="#26333d" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Rosso = positivo DC   •   Nero = negativo / GND   •   Pallino pieno = collegamento</text>
