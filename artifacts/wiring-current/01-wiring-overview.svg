<polyline points="950,1177 1002,1177" fill="none" stroke="white" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="950,1177 1002,1177" fill="none" stroke="#226db5" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="65" y="47" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#267751" text-anchor="start">MINÙ / CABLAGGIO · SCHEMI FORNITI + DOCUMENTAZIONE HX711</text>
<text x="65" y="102" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#25323a" text-anchor="start">01   Tutta la bilancia, a colpo d’occhio</text>
<text x="65" y="143" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#596a76" text-anchor="start">Le tavole 2–7 mostrano ogni filo e resistenza; la tavola 7 aggiunge il rilevamento USB con PC817.</text>
<rect x="65" y="220" width="280" height="160" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="83" cy="238" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="327" cy="238" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="205.0" y="265" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">NASTIMA</text>
<text x="205.0" y="295" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">6,4 V · 6 Ah · USB-C</text>
<rect x="440" y="220" width="250" height="160" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="458" cy="238" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="672" cy="238" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="565.0" y="265" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">INA219</text>
<text x="565.0" y="295" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Positivo VIN+ → VIN−</text>
<rect x="795" y="220" width="190" height="160" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="813" cy="238" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="967" cy="238" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="890.0" y="265" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">S1</text>
<text x="890.0" y="295" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Interruttore</text>
<rect x="1090" y="220" width="270" height="160" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1108" cy="238" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1342" cy="238" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="1225.0" y="265" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">Mini360</text>
<text x="1225.0" y="295" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">OUT+ regolato a 5,11 V</text>
<text x="390" y="278" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#98651a" text-anchor="middle">F1</text>
<text x="1450" y="277" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#ca4239" text-anchor="start">Linea 5 V</text>
<text x="1450" y="312" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">VIN ESP32 · HX711</text>
<text x="1450" y="344" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Audio attraverso IRF9540</text>
<text x="65" y="195" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#25323a" text-anchor="start">Ricarica USB-C sul pacco NASTIMA; PC817 in parallelo all’ingresso USB, dettaglio tavola 7.</text>
<rect x="710" y="505" width="365" height="390" rx="18" fill="#edf2f7" stroke="#8cab9b" stroke-width="2"/>
<circle cx="728" cy="523" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1057" cy="523" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="892.5" y="550" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">ESP32 DevKit</text>
<text x="892.5" y="580" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Usa le sigle GPIO sulla scheda</text>
<rect x="755" y="600" width="275" height="75" rx="5" fill="#aab4bc" stroke="#87939c" stroke-width="2"/>
<text x="892.5" y="645" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#25323a" text-anchor="middle">ESP32</text>
<text x="892" y="730" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#25323a" text-anchor="middle">GPIO = sigla del pin</text>
<text x="892" y="771" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#25323a" text-anchor="middle">Nessun 5 V sui GPIO</text>
<text x="892" y="823" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#c57a12" text-anchor="middle">3V3: OLED / INA / buzzer</text>
<rect x="65" y="495" width="465" height="285" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="83" cy="513" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="512" cy="513" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="297.5" y="540" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">Cella + HX711</text>
<text x="297.5" y="570" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Tavola 3</text>
<text x="92" y="612" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#25323a" text-anchor="start">E+ / E− / A+ / A− → cella</text>
<text x="92" y="644" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#25323a" text-anchor="start">GPIO16 → 220 Ω → SCK</text>
<text x="92" y="676" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#25323a" text-anchor="start">DOUT → 10 kΩ → GPIO35</text>
<text x="92" y="708" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#25323a" text-anchor="start">GPIO35 → 20 kΩ → GND</text>
<text x="92" y="740" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#25323a" text-anchor="start">VCC 5 V · GND comune</text>
<rect x="1325" y="495" width="410" height="265" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1343" cy="513" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1717" cy="513" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="1530.0" y="540" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">OLED SSD1322</text>
<text x="1530.0" y="570" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Tavola 6</text>
<text x="1350" y="612" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">18 → SCK · 23 → DIN/MOSI</text>
<text x="1350" y="644" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">25 → CS · 26 → DC · 27 → RST</text>
<text x="1350" y="676" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">VCC da ESP32 3V3 · GND comune</text>
<text x="1350" y="708" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Collegamenti dallo schema fornito</text>
<rect x="1325" y="805" width="410" height="305" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1343" cy="823" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1717" cy="823" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="1530.0" y="850" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">DFPlayer + altoparlante</text>
<text x="1530.0" y="880" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Tavola 4 · IRF9540 + 2N3904</text>
<text x="1350" y="912" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">GPIO4 → 1 kΩ → RX</text>
<text x="1350" y="943" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">TX → GPIO34 · BUSY → GPIO39</text>
<text x="1350" y="974" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">GPIO2 → 10 kΩ → base NPN</text>
<text x="1350" y="1005" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">100 kΩ G–S · 100 kΩ B–GND</text>
<text x="1350" y="1036" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">VCC dal MOSFET · SPK1/SPK2</text>
<text x="1350" y="1067" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Audio: 470 µF / 16 V + 104</text>
<rect x="65" y="830" width="465" height="280" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="83" cy="848" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="512" cy="848" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="297.5" y="875" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">LED rosso + buzzer</text>
<text x="297.5" y="905" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Tavola 5</text>
<text x="87" y="947" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">GPIO15 → 1 kΩ → LED + · − → GND</text>
<text x="87" y="981" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">GPIO22 → 220 Ω → B BC337-40</text>
<text x="87" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Buzzer + → 3V3 · − → C · E → GND</text>
<text x="87" y="1049" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">1N5819 ai capi · fascetta verso +</text>
<rect x="635" y="960" width="570" height="150" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
<circle cx="653" cy="978" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1187" cy="978" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="920.0" y="1005" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">Tastiera 4 × 2</text>
<text x="920.0" y="1035" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Tavola 5 · soltanto 6 fili, senza VCC / GND</text>
<text x="660" y="1076" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#25323a" text-anchor="start">R1/2/3/4 → 13/14/19/21 · C1/2 → 17/5</text>
<text x="635" y="1147" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#596a76" text-anchor="start">PC817: USB con 560 Ω; GPIO36 con pull-up 10 kΩ a 3V3. Tavola 7.</text>
<text x="133" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Positivo 5 V</text>
<text x="448" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">GND comune</text>
<text x="783" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">3,3 V</text>
<text x="1018" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Segnali</text>
<text x="1235" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">● = unione dei fili</text>
<text x="65" y="1224" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="start">Questa panoramica raggruppa i fili. Per saldare usa le tavole di dettaglio e le sigle reali sui moduli.</text>
