<text x="850" y="552" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#25323a" text-anchor="middle">10 kΩ</text>
<g transform="translate(650 665) rotate(90)"><path d="M-75 0H-42 M42 0H75" stroke="#25323a" stroke-width="6"/><rect x="-42" y="-15" width="84" height="30" rx="11" fill="#edd8ac" stroke="#a99169" stroke-width="2"/><path d="M-24 -13V13 M0 -13V13 M24 -13V13" stroke="#b69c74" stroke-width="6"/></g>
<text x="678" y="673" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#25323a" text-anchor="start">20 kΩ</text>
<text x="485" y="510" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#25323a" text-anchor="start">Punto comune GPIO35</text>
<text x="770" y="873" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#25323a" text-anchor="middle">20 kΩ scende a GND; non va in fila su DOUT.</text>
<rect x="1520" y="260" width="210" height="420" rx="8" fill="#bdc8cf" stroke="#899ba6" stroke-width="2"/>
