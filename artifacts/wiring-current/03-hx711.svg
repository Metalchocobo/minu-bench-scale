<text x="252.5" y="275" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">ESP32 DevKit</text>
<text x="252.5" y="305" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Usa le sigle GPIO sulla scheda</text>
<rect x="110" y="325" width="285" height="75" rx="5" fill="#aab4bc" stroke="#87939c" stroke-width="2"/>
<text x="252.5" y="370" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#25323a" text-anchor="middle">ESP32</text>
<text x="423" y="408" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO16 / RX2</text>
<text x="423" y="588" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO35</text>
<text x="423" y="758" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#ca4239" text-anchor="end">Linea 5 V</text>
<text x="423" y="828" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#25323a" text-anchor="end">GND</text>
<rect x="1070" y="230" width="305" height="660" rx="18" fill="#e8f3ee" stroke="#8cab9b" stroke-width="2"/>
