<text x="65" y="47" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#267751" text-anchor="start">MINÙ / CABLAGGIO · SCHEMI FORNITI + DOCUMENTAZIONE HX711</text>
<text x="65" y="102" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#25323a" text-anchor="start">03   HX711 e cella di carico</text>
<text x="65" y="143" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#596a76" text-anchor="start">HX711 alimentato dalla linea 5 V; il partitore è sul solo filo DOUT diretto a GPIO35.</text>
<rect x="65" y="230" width="375" height="660" rx="18" fill="#edf2f7" stroke="#8cab9b" stroke-width="2"/>
<circle cx="83" cy="248" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
