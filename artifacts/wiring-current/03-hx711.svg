<text x="1625" y="726" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#25323a" text-anchor="middle">CELLA DI CARICO</text>
<text x="1358" y="308" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#ca4239" text-anchor="end">E+</text>
<text x="1445" y="282" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="middle">Rosso</text>
<text x="1358" y="378" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#25323a" text-anchor="end">E−</text>
<text x="1445" y="352" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="middle">Nero</text>
<text x="1358" y="448" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#267751" text-anchor="end">A+</text>
<text x="1445" y="422" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="middle">Verde</text>
<text x="1358" y="518" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#8a96a0" text-anchor="end">A−</text>
<text x="1445" y="492" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="middle">Bianco</text>
<rect x="65" y="950" width="1670" height="167" rx="16" fill="#fff7e8" stroke="#dfc79a" stroke-width="2"/>
<text x="87" y="986" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#98651a" text-anchor="start">Prima di replicare</text>
<text x="87" y="1020" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">I colori della cella sono la convenzione documentata: controlla E+ / E− / A+ / A− della cella che usi.</text>
<text x="87" y="1051" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Replica: prevedere 100 kΩ fra SCK e GND, dopo la 220 Ω lato HX711, vicino al modulo.</text>
<text x="87" y="1082" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">VCC a 5 V ed E+/E− verso la cella non significano 5 V sui GPIO dell’ESP32.</text>
<text x="133" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Positivo 5 V</text>
<text x="448" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">GND comune</text>
<text x="783" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">3,3 V</text>
<text x="1018" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Segnali</text>
<text x="1235" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">● = unione dei fili</text>
<text x="65" y="1224" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="start">I terminali sono disposti per leggibilità: segui le sigle, non la posizione nel disegno.</text>
