<text x="1502.5" y="295" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">6 fili · nessun VCC / GND</text>
<text x="373" y="363" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO17</text>
<text x="1287" y="363" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#226db5" text-anchor="start">Filo 1 · R1</text>
<text x="373" y="433" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO5</text>
<text x="1287" y="433" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#226db5" text-anchor="start">Filo 2 · R2</text>
<text x="373" y="503" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO13</text>
<text x="1287" y="503" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#226db5" text-anchor="start">Filo 3 · R3</text>
<text x="373" y="573" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO14</text>
<text x="1287" y="573" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#226db5" text-anchor="start">Filo 4 · R4</text>
