<text x="1287" y="643" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#226db5" text-anchor="start">Filo 5 · C1</text>
<text x="373" y="713" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO21</text>
<text x="1287" y="713" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#226db5" text-anchor="start">Filo 6 · C2</text>
