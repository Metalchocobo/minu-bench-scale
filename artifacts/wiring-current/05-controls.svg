<text x="1644" y="649" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#25323a" text-anchor="middle">TARE</text>
<text x="600" y="766" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#25323a" text-anchor="start">R1–R4 e C1–C2: verificare l’ordine del connettore della tastiera.</text>
<text x="373" y="883" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO22</text>
<circle cx="1400" cy="875" r="72" fill="#2b3b45" stroke="#1c2b33" stroke-width="2"/>
<circle cx="1400" cy="875" r="18" fill="#152129" stroke="#152129" stroke-width="2"/>
<text x="1350" y="862" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="start">+</text>
<text x="1420" y="941" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#25323a" text-anchor="start">−</text>
<text x="1530" y="869" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#25323a" text-anchor="start">Buzzer passivo</text>
<text x="1530" y="905" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#25323a" text-anchor="start">Segnale → GPIO22</text>
<text x="1530" y="941" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#25323a" text-anchor="start">Negativo → GND</text>
<text x="373" y="1018" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#226db5" text-anchor="end">GPIO15</text>
