<polyline points="980,1177 1028,1177" fill="none" stroke="white" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="980,1177 1028,1177" fill="none" stroke="#226db5" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1350,1177 1398,1177" fill="none" stroke="white" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1350,1177 1398,1177" fill="none" stroke="#25323a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="65" y="47" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#267751" text-anchor="start">MINÙ / CABLAGGIO · SCHEMI FORNITI + DOCUMENTAZIONE HX711</text>
<text x="65" y="102" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#25323a" text-anchor="start">07   Presenza USB con PC817</text>
<text x="65" y="143" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#596a76" text-anchor="start">USB esterna al pacco → optoisolatore → GPIO36 / VP. USB presente = LOW; USB assente = HIGH.</text>
<rect x="65" y="174" width="1670" height="94" rx="16" fill="#fff7e8" stroke="#dfc79a" stroke-width="2"/>
<text x="87" y="210" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#98651a" text-anchor="start">Punto di prelievo: cavo USB di ricarica, soltanto 5 V DC</text>
<text x="87" y="244" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Preleva USB +5 V e USB − prima dell’ingresso del pacco. Il ramo PC817 è in parallelo al caricatore.</text>
<rect x="65" y="290" width="400" height="200" rx="18" fill="#fff1ed" stroke="#8cab9b" stroke-width="2"/>
<circle cx="83" cy="308" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="447" cy="308" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="265.0" y="335" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">USB ESTERNA</text>
<text x="265.0" y="365" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Alimentatore / cavo · 5 V DC</text>
<rect x="1260" y="290" width="475" height="200" rx="18" fill="#fff1ed" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1278" cy="308" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1717" cy="308" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="1497.5" y="335" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">USB-C NASTIMA</text>
<text x="1497.5" y="365" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Ingresso del caricatore interno</text>
<text x="448" y="398" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#ca4239" text-anchor="end">+5 V</text>
<text x="448" y="458" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#25323a" text-anchor="end">USB −</text>
<text x="1277" y="398" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#ca4239" text-anchor="start">+5 V USB</text>
<text x="1277" y="458" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#25323a" text-anchor="start">USB −</text>
<text x="860" y="319" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#25323a" text-anchor="middle">PERCORSO DI RICARICA DIRETTO</text>
<text x="860" y="345" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#ca4239" text-anchor="middle">La resistenza 560 Ω non va su questo percorso.</text>
<text x="90" y="544" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#ca4239" text-anchor="start">LATO USB · ramo PC817</text>
<text x="1202" y="541" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#226db5" text-anchor="start">LATO ESP32</text>
<rect x="790" y="560" width="320" height="300" rx="15" fill="#344650" stroke="#25323a" stroke-width="2"/>
<path d="M920 560 A30 30 0 0 0 980 560" fill="#ffffff" stroke="#25323a" stroke-width="3"/>
<circle cx="813" cy="585" r="8" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="803" y="627" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">1  ANODO</text>
<text x="803" y="777" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">2  CATODO</text>
<text x="1097" y="627" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">4  COLLETTORE</text>
<text x="1097" y="777" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">3  EMETTITORE</text>
<text x="950.0" y="706" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">PC817</text>
<text x="950.0" y="739" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#d6e3e9" text-anchor="middle">DIP-4</text>
<text x="950.0" y="535" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#25323a" text-anchor="middle">VISTA DALL’ALTO · TACCA IN ALTO</text>
<text x="950.0" y="888" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#596a76" text-anchor="middle">Il puntino identifica il pin 1</text>
<g transform="translate(640 650)"><path d="M-75 0H-42 M42 0H75" stroke="#ca4239" stroke-width="6"/><rect x="-42" y="-15" width="84" height="30" rx="11" fill="#edd8ac" stroke="#a99169" stroke-width="2"/><path d="M-24 -13V13 M0 -13V13 M24 -13V13" stroke="#b69c74" stroke-width="6"/></g>
<text x="640" y="622" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#25323a" text-anchor="middle">560 Ω · ¼ W</text>
<text x="90" y="610" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#ca4239" text-anchor="start">USB +5 V</text>
<text x="90" y="645" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#ca4239" text-anchor="start">↓ ramo PC817</text>
<text x="90" y="760" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#25323a" text-anchor="start">USB −</text>
<text x="90" y="832" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">560 Ω limita solo la corrente del pin 1.</text>
<text x="90" y="869" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#596a76" text-anchor="start">La ricarica del pacco prosegue nei due fili sopra.</text>
<rect x="1440" y="505" width="295" height="375" rx="18" fill="#e7eef5" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1458" cy="523" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<circle cx="1717" cy="523" r="5" fill="#ffffff" stroke="#8cab9b" stroke-width="2"/>
<text x="1587.5" y="550" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#25323a" text-anchor="middle">ESP32 DevKit</text>
<text x="1587.5" y="580" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="middle">Tre fili sul lato ESP32</text>
<text x="1457" y="628" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#c57a12" text-anchor="start">3V3</text>
<text x="1457" y="778" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#226db5" text-anchor="start">GPIO36 / VP</text>
<text x="1457" y="863" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#25323a" text-anchor="start">GND ESP32</text>
<g transform="translate(1320 695) rotate(90)"><path d="M-75 0H-42 M42 0H75" stroke="#c57a12" stroke-width="6"/><rect x="-42" y="-15" width="84" height="30" rx="11" fill="#edd8ac" stroke="#a99169" stroke-width="2"/><path d="M-24 -13V13 M0 -13V13 M24 -13V13" stroke="#b69c74" stroke-width="6"/></g>
<text x="1348" y="703" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#25323a" text-anchor="start">10 kΩ</text>
<text x="1202" y="585" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#25323a" text-anchor="start">Pull-up esterna</text>
<text x="1202" y="615" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#c57a12" text-anchor="start">verso 3V3</text>
<rect x="65" y="925" width="510" height="200" rx="16" fill="#fff7e8" stroke="#dfc79a" stroke-width="2"/>
<text x="87" y="961" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#98651a" text-anchor="start">1 · Collegamenti del PC817</text>
<text x="87" y="995" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">USB +5 V → 560 Ω → pin 1 (anodo)</text>
<text x="87" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">USB − → pin 2 (catodo)</text>
<text x="87" y="1057" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Pin 4 (collettore) → GPIO36 / VP</text>
<text x="87" y="1088" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Pin 3 (emettitore) → GND ESP32</text>
<rect x="600" y="925" width="570" height="200" rx="16" fill="#fff7e8" stroke="#dfc79a" stroke-width="2"/>
<text x="622" y="961" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#98651a" text-anchor="start">2 · Resistenza e lettura digitale</text>
<text x="622" y="995" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">10 kΩ fra GPIO36 / VP e 3V3 ESP32.</text>
<text x="622" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">USB presente: GPIO36 / VP = LOW.</text>
<text x="622" y="1057" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">USB assente: GPIO36 / VP = HIGH.</text>
<text x="622" y="1088" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Rileva la presenza dei 5 V USB esterni.</text>
<rect x="1195" y="925" width="540" height="200" rx="16" fill="#fff7e8" stroke="#dfc79a" stroke-width="2"/>
<text x="1217" y="961" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#98651a" text-anchor="start">3 · Limiti della lettura</text>
<text x="1217" y="995" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Nessun ponte USB − / GND ESP32 qui.</text>
<text x="1217" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Isolamento globale del pacco non stabilito.</text>
<text x="1217" y="1057" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Non misura corrente né fine carica.</text>
<text x="1217" y="1088" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">Collaudo fisico non documentato.</text>
<text x="127" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">+5 V USB</text>
<text x="452" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">USB −</text>
<text x="712" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">3V3 ESP32</text>
<text x="1042" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">GPIO36 / VP</text>
<text x="1412" y="1185" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#25323a" text-anchor="start">GND ESP32</text>
<text x="65" y="1224" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#596a76" text-anchor="start">Pinout: SHARP PC817XxNSZ1B, p. 2, vista dall’alto. ● = unione; incrocio senza punto = nessun collegamento.</text>
